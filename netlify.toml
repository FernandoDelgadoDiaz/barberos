[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Transición diaria de estados de suscripción (active/grace_period/suspended)
[functions."cron-subscriptions"]
  schedule = "0 12 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200