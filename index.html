<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />

    <!-- Identidad BarberOS compartida en iOS, Android y navegador. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="application-name" content="BarberOS" />
    <meta name="apple-mobile-web-app-title" content="BarberOS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to return non-zero
      values on iOS Safari (iPhone X and later). Without it, the safe-area inset
      env() variables resolve to 0 and our floating bottom nav / sticky CTA fall
      under the home indicator.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Google Fonts load WITHOUT blocking the first paint: a render-blocking
      stylesheet left the app blank (and Android's launch splash on screen) when
      fonts.googleapis.com was slow or unreachable from the shop's network. The
      app shows system fonts first and swaps when the fonts arrive.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>

    <title>BarberOS | Gestión para barberías</title>
  </head>
  <body>
    <!-- Painted before any JavaScript runs, so the phone never sits on a blank screen.
         React replaces it on mount. -->
    <div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F8FAFC;font-family:system-ui,sans-serif;color:#94A3B8"><div style="font-weight:700;font-size:22px;color:#0F172A">BarberOS</div><div style="font-size:14px">Cargando…</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
