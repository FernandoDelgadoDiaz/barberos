<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />

    <!-- Identidad BarberOS compartida en iOS, Android y navegador. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="application-name" content="BarberOS" />
    <meta name="apple-mobile-web-app-title" content="BarberOS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to return non-zero
      values on iOS Safari (iPhone X and later). Without it, the safe-area inset
      env() variables resolve to 0 and our floating bottom nav / sticky CTA fall
      under the home indicator.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Google Fonts for Dark Luxury Design -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Inter font for glassmorphism UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <title>BarberOS | Gestión para barberías</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
